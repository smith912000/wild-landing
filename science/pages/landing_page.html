<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILD — Redirecting…</title>
  <link rel="canonical" href="https://smith912000.github.io/wild-programme/">
  <meta name="robots" content="noindex, follow">
  <!-- Primary redirect: meta refresh (works with JS disabled) -->
  <meta http-equiv="refresh" content="0; url=https://smith912000.github.io/wild-programme/">
  <style>
    html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .box{max-width:420px;padding:24px}
    h1{font-size:1.4rem;font-weight:700;letter-spacing:.04em;margin:0 0 10px}
    p{color:#8b949e;font-size:.95rem;line-height:1.6;margin:0 0 18px}
    a{color:#e3a008;text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
  </style>
  <!-- Fallback redirect: JS (covers edge cases where meta refresh is blocked) -->
  <script>
    window.location.replace("https://smith912000.github.io/wild-programme/");
  </script>
</head>
<body>
  <div class="box">
    <h1>WILD has moved</h1>
    <p>Taking you to the threshold…</p>
    <p>If you are not redirected automatically,
      <a href="https://smith912000.github.io/wild-programme/">enter here</a>.</p>
  </div>
</body>
</html>
